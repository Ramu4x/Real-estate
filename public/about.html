<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - Real Estate Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="premium.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-home"></i>
                <span>RealEstatePro</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="properties.html" class="nav-link">Properties</a></li>
                <li><a href="ai-tools.html" class="nav-link">AI Tools</a></li>
                <li><a href="about.html" class="nav-link active">About</a></li>
            </ul>
            <div class="nav-auth">
                <button id="themeToggle" class="theme-toggle" title="Toggle dark/light theme">
                <div class="message ai">
                    Hello! I'm your AI property assistant. How can I help you find your dream home today?
                </div>
            </div>
            <form class="ai-chat-input" id="aiChatForm">
                <input type="text" id="aiInput" placeholder="Ask about properties, areas..." autocomplete="off">
                <button type="submit">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Set active nav link and back button
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });
            document.querySelector('[href="about.html"]').classList.add('active');

            // Back button functionality
            const backButton = document.querySelector('.back-button');
            if (backButton) {
                backButton.addEventListener('click', function (e) {
                    e.preventDefault();
                    window.history.back();
                });
            }

            // Handle contact form submission
            document.getElementById('contactForm')?.addEventListener('submit', function (e) {
                e.preventDefault();
                showMessage('Thank you for your message! We\'ll get back to you soon.', 'success');
                this.reset();
            });

            // Initialize mobile navigation
            setupMobileNavigation();
        });
    </script>
</body>

</html>
